server:
  port: ${PORT:8080}

spring:
  jpa:
    open-in-view: 'false'
  main:
    allow-circular-references: 'true'
  datasource:
    username: postgres
    url: jdbc:postgresql://${DB_URL}/ragdb
    password: postgres
  ai:
    ollama:
      chat:
        model: gemma3:4b-it-q4_K_M
      base-url: ${AI_URL}
  application:
    name: And-demo
  flyway:
    baseline-description: true
    baseline-on-migrate: true
    create-schemas: true
    default-schema: public
    enabled: true
    locations: filesystem:./sql/migrations
    schemas: public
    url: jdbc:postgresql://${DB_URL}/ragdb
    user: postgres
    password: postgres
    validate-on-migrate: true

use:
  rag: 'true'
